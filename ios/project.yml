name: PersonalShopper
options:
  bundleIdPrefix: dev.willsawyerrrr.personal-shopper
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  PersonalShopperKit:
    path: Packages/PersonalShopperKit
targets:
  PersonalShopper:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PersonalShopperKit
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.personal-shopper
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Personal Shopper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.willsawyerrrr.personal-shopper
            CFBundleURLSchemes: [dev.willsawyerrrr.personal-shopper]
    entitlements:
      path: App/PersonalShopper.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.willsawyerrrr.personal-shopper]
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: PersonalShopperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.personal-shopper.share
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Personal Shopper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.willsawyerrrr.personal-shopper]
schemes:
  PersonalShopper:
    build:
      targets:
        PersonalShopper: all
    run:
      config: Debug
    test:
      targets:
        - package: PersonalShopperKit/PersonalShopperKitTests
