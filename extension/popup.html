<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --color-bg: #f6f7f5;
        --color-surface: #ffffff;
        --color-border: #dde1db;
        --color-text: #1f2a24;
        --color-text-muted: #667066;
        --color-accent: #1f7a4d;
        --color-accent-hover: #17603c;
        --color-link: #1f7a4d;
        --color-focus-ring: rgb(31 122 77 / 15%);
        --color-danger: #b3261e;
        --radius: 10px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #121714;
          --color-surface: #1b231e;
          --color-border: #34413a;
          --color-text: #e8eee9;
          --color-text-muted: #a3b0a7;
          --color-accent: #2f9a65;
          --color-accent-hover: #3aae75;
          --color-link: #6fd6a2;
          --color-focus-ring: rgb(111 214 162 / 30%);
          --color-danger: #ff8f86;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        width: 300px;
        margin: 0;
        padding: 1rem;
        background: var(--color-bg);
        color: var(--color-text);
      }
      h1 {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p#status {
        font-size: 0.85rem;
        margin: 0 0 0.75rem;
        color: var(--color-text-muted);
      }
      p#status.error {
        color: var(--color-danger);
      }
      p#status.success {
        color: var(--color-link);
      }
      label {
        display: block;
        margin-bottom: 0.65rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--color-text-muted);
      }
      input {
        width: 100%;
        margin-top: 0.3rem;
        padding: 0.45rem 0.55rem;
        font-size: 0.9rem;
        font-family: inherit;
        color: var(--color-text);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
      }
      input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-focus-ring);
      }
      button {
        width: 100%;
        padding: 0.55rem;
        font-size: 0.9rem;
        font-weight: 600;
        font-family: inherit;
        color: #fff;
        background: var(--color-accent);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
      }
      button:hover {
        background: var(--color-accent-hover);
      }
      button.secondary {
        color: var(--color-link);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
      }
      button.secondary:hover {
        background: var(--color-bg);
      }
      .footer {
        margin-top: 0.85rem;
        text-align: center;
      }
      .footer a {
        font-size: 0.8rem;
        color: var(--color-text-muted);
        text-decoration: none;
      }
      .footer a:hover {
        color: var(--color-link);
      }
    </style>
  </head>
  <body>
    <h1>Add to Personal Shopper</h1>
    <p id="status"></p>
    <button id="openWoolworths" type="button" class="secondary" hidden>
      Open woolworths.com.au
    </button>
    <button id="signIn" type="button" hidden>Sign in with Google</button>
    <form id="form">
      <label
        >Trigger word
        <input id="word" name="word" required placeholder="milk" />
      </label>
      <label
        >Quantity
        <input id="quantity" name="quantity" type="number" min="1" value="1" />
      </label>
      <input id="url" type="hidden" />
      <button type="submit">Add item</button>
    </form>
    <div class="footer">
      <a id="adminLink" href="#" target="_blank" rel="noopener">Manage items</a>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
