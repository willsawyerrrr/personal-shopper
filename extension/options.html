<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 360px;
        margin: 2rem auto;
      }
      label {
        display: block;
        margin-bottom: 0.75rem;
      }
      input {
        width: 100%;
        padding: 0.4rem;
        box-sizing: border-box;
        margin-top: 0.25rem;
      }
      button {
        padding: 0.4rem 0.8rem;
      }
      #status {
        color: #2e7d32;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Personal Shopper settings</h1>
    <form id="form">
      <label
        >Server URL
        <input id="serverUrl" placeholder="http://localhost:3000" required />
      </label>
      <label
        >Shared secret
        <input id="sharedSecret" type="password" required />
      </label>
      <button type="submit">Save</button>
      <span id="status"></span>
    </form>
    <script src="options.js"></script>
  </body>
</html>
