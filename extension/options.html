<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --color-bg: #f6f7f5;
        --color-surface: #ffffff;
        --color-border: #dde1db;
        --color-text: #1f2a24;
        --color-text-muted: #667066;
        --color-accent: #1f7a4d;
        --color-accent-hover: #17603c;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        max-width: 360px;
        margin: 3rem auto;
        padding: 1.5rem;
        background: var(--color-surface);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 1.25rem;
      }
      label {
        display: block;
        margin-bottom: 0.85rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--color-text-muted);
      }
      input {
        width: 100%;
        margin-top: 0.3rem;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        font-family: inherit;
        color: var(--color-text);
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
      }
      input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px rgb(31 122 77 / 15%);
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
        font-family: inherit;
        color: #fff;
        background: var(--color-accent);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
      }
      button:hover {
        background: var(--color-accent-hover);
      }
      button.secondary {
        color: var(--color-accent);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
      }
      button.secondary:hover {
        background: var(--color-bg);
      }
      #account {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--color-border);
      }
      h2 {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 0.6rem;
      }
      #passkey {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--color-border);
      }
      #passkey .hint {
        margin: 0 0 0.85rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
      }
      #passkeyState.error {
        color: #b3261e;
      }
      #passkeyState.success {
        color: var(--color-accent);
      }
      #accountState,
      #passkeyState {
        margin: 0 0 0.85rem;
        font-size: 0.85rem;
        color: var(--color-text-muted);
      }
      #accountError {
        margin: 0.6rem 0 0;
        font-size: 0.85rem;
        color: #b3261e;
      }
      #status {
        margin-left: 0.6rem;
        font-size: 0.85rem;
        color: var(--color-accent);
      }
    </style>
  </head>
  <body>
    <h1>Personal Shopper settings</h1>
    <form id="form">
      <label
        >Server URL
        <input id="serverUrl" placeholder="http://192.168.1.50:3000" required />
      </label>
      <button type="submit">Save</button>
      <span id="status"></span>
    </form>
    <section id="account">
      <h2>Account</h2>
      <p id="accountState"></p>
      <button id="signIn" type="button">Sign in with Google</button>
      <button id="signOut" type="button" class="secondary" hidden>Sign out</button>
      <p id="accountError" class="error"></p>
    </section>
    <section id="passkey">
      <h2>Woolworths passkey</h2>
      <p class="hint">
        Lets the server sign in to your Woolworths account when its session expires. Chrome shows a
        debugging bar while you register.
      </p>
      <p id="passkeyState"></p>
      <button id="registerPasskey" type="button">Register passkey</button>
      <button id="cancelPasskey" type="button" class="secondary" hidden>Cancel</button>
      <button id="removePasskey" type="button" class="secondary" hidden>Remove passkey</button>
    </section>
    <script type="module" src="options.js"></script>
  </body>
</html>
