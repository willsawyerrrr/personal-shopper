app = "personal-shopper"
primary_region = "syd"

[build]

[env]
  PORT = "3000"
  TRUST_PROXY = "true"
  ITEMS_PATH = "/data/items.yml"
  SESSION_PATH = "/data/session.json"
  PASSKEY_CREDENTIALS_PATH = "/data/passkey-credentials.json"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
