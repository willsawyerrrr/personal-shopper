name: Package extension

on:
  push:
    branches: [main]
    paths:
      ['extension/**', 'scripts/package-extension.ts', '.github/workflows/package-extension.yml']
  pull_request:
    paths:
      ['extension/**', 'scripts/package-extension.ts', '.github/workflows/package-extension.yml']

concurrency:
  group: package-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package-extension
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/extension.zip
